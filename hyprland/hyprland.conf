# =========================
# HYPRLAND
# =========================

$terminal = kitty
$menu = wofi --show drun
$filemanager = dolphin
$browser = firefox

# Monitor
monitor = , preferred, auto, 1

# Variáveis de ambiente
env = QT_QPA_PLATFORMTHEME,qt6ct

# Teclado
input {
    kb_layout = br
    kb_variant = abnt2
    follow_mouse = 1
}

# Janelas
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    layout = dwindle
}

dwindle {
    force_split = 0
    preserve_split = true
    smart_split = true
    smart_resizing = true
    permanent_direction_override = false
    special_scale_factor = 1
    split_width_multiplier = 1.0
    use_active_for_splits = true
    default_split_ratio = 1.0
    split_bias = 0
    precise_mouse_move = false
}

# Aparência
decoration {
    rounding = 10

    shadow {
        enabled = true
        range = 4
        render_power = 3
    }
}

# Animações
animations {
    enabled = true
}

# =========================
# PROGRAMAS
# =========================

exec-once = waybar

# =========================
# ATALHOS
# =========================

# Terminal
bind = SUPER, RETURN, exec, $terminal
bind = SUPER, T, exec, $terminal

# Launcher
bind = SUPER, SPACE, exec, $menu

# Arquivos
bind = SUPER, E, exec, thunar

# Navegador
bind = SUPER, B, exec, $browser

# Fechar janela
bind = SUPER, Q, killactive

# Sair do Hyprland
bind = SUPER, M, exit

# Recarregar configuração
bind = SUPER SHIFT, R, exec, hyprctl reload

# =========================
# ATALHOS EXTRAS
# =========================

# Discord
bind = SUPER, V, exec, flatpak run com.discordapp.Discord

# Tela cheia
bind = SUPER, F, fullscreen

# Navegação entre janelas
bind = SUPER, LEFT, movefocus, l
bind = SUPER, RIGHT, movefocus, r
bind = SUPER, UP, movefocus, u
bind = SUPER, DOWN, movefocus, d

# Mover janelas
bind = SUPER SHIFT, LEFT, movewindow, l
bind = SUPER SHIFT, RIGHT, movewindow, r
bind = SUPER SHIFT, UP, movewindow, u
bind = SUPER SHIFT, DOWN, movewindow, d

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Mover janela para workspace
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9

# Screenshot
bind = SUPER, S, exec, grim ~/Pictures/screenshot-$(date +%Y-%m-%d_%H-%M-%S).png

bind = SUPER SHIFT, S, exec, grim -g "$(slurp)" - | wl-copy

# =========================
# Mouse - mover/redimensionar janelas
# =========================
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

bind = SUPER SHIFT, P, togglefloating
bind = SUPER SHIFT, P, pin

bind = SUPER, W, exec, /home/phantom/my-dotfiles/quickshell/wallpaper-switcher/launch.sh
bind = SUPER, W, exec, /home/phantom/my-dotfiles/quickshell/wallpaper-switcher/launch.sh
bind = SUPER SHIFT, W, exec, /home/phantom/my-dotfiles/quickshell/wallpaper-switcher/theme-selector.sh
bind = SUPER SHIFT, B, exec, ~/.config/waybar/theme-selector.sh
exec-once = ~/my-dotfiles/scripts/start/wallpaper-start.sh
